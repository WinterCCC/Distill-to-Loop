# The released recipe: SD3-medium distilled into a looped student of 2 pre + 5 shared x 4 + 2 post blocks
# (schema: distill_to_loop.config.DistillConfig). Paths marked PLACEHOLDER must be set, here or on the command line
# (for example data.train_dir=/path/to/coco2017_512/train).
#
# Global batch: 144 rows per step = 2 GPUs x 72 rows; per GPU 48 data rows and 24 online rollout rows
# (3 trajectories x 8 Euler steps). There is no gradient accumulation, so the global batch is
# GPUs x per_gpu_batch_size. Layouts that keep 144 rows per step (GPUs x per_gpu_batch_size):
# 1x144, 2x72, 3x48, 6x24. Other layouts train with another batch (the trainer prints a warning).
# The rollout rows per GPU, round(per_gpu_batch_size * online_rollout.ratio), must be a positive
# multiple of the 8 rollout steps (online_rollout.steps), e.g. 24, 48 or 72 rows per GPU; otherwise
# the trainer stops with an error.
#
# Disk: the prepared COCO 2017 train split (data.train_dir) takes about 182 GB (119 shards); every
# training checkpoint takes about 12 GB, and train.keep_last of them are kept (about 120 GB at 10).
name: sd3m_dooop
seed: 0
# Checkpoints go to <output_dir>/<name>/. The default is relative to the current directory, so with
# scripts/launch_train.sh (which runs from the repository root) they land in ./checkpoints/ inside the
# repository (ignored by git). Point output_dir to a disk with room for keep_last x 12 GB.
output_dir: checkpoints

paths:
  hf_cache: null                 # Hugging Face hub cache of the teacher (null: HF_HUB_CACHE or the default cache)

wandb:
  enabled: false                 # optional Weights & Biases logging
  project: distill-to-loop
  entity: null
  tags: []
  notes: ""

model:
  teacher_model_id: stabilityai/stable-diffusion-3-medium-diffusers
  teacher_transformer_path: ""   # optional local transformer directory replacing the teacher transformer
  n_pre: 2
  n_loop: 5
  n_post: 2
  n_rounds: 4

data:
  train_dir: PLACEHOLDER         # written by scripts/prepare_coco.py (COCO 2017 train at 512 px, about 182 GB)
  # A resume reproduces the uninterrupted run exactly only with num_workers: 0. With workers the sample
  # order is the same, but after a resume within an epoch the latents drawn from the stored VAE
  # posteriors differ from those of the uninterrupted run.
  num_workers: 8

optim:
  lr: 1.732e-4
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0
  warmup_steps: 500
  grad_clip: 1.0

loss:
  logit_mean: 0.0
  logit_std: 1.0
  cfg_dropout_p: 0.1
  prelude_weight: 0.1

train:
  per_gpu_batch_size: 72         # see the layouts above
  max_steps: 100000
  checkpoint_every: 1000
  keep_last: 10                  # checkpoints kept in the run directory, about 12 GB each
  log_every: 10
  dist_timeout_minutes: 120
  # Activation checkpointing (memory only: the losses and gradients are the same with and without it;
  # both may change on resume). The released run trained on 2 x NVIDIA B200 with round checkpointing
  # only and 72 rows per GPU, and peaked at 137.63 GiB per GPU, close to the capacity of 141 GB cards.
  # Per-block checkpointing of every transformer block reduces the activation memory further, at the
  # cost of more recomputation.
  loop_grad_checkpoint: true     # recompute each loop round's shared blocks in the backward pass
  block_grad_checkpoint: false   # recompute each transformer block in the backward pass

online_rollout:
  ratio: 0.333333
  steps: 8
  mix_w: 2.0
  teacher_cfg_scale: 4.5

ema:
  decay: 0.9995
